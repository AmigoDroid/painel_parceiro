<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#090d17"/>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png"/>
  <link rel="icon" href="/favicon.ico" sizes="48x48"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Delta Parceiro"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="referrer" content="no-referrer"/>
  <title>Delta TV | Painel do Parceiro</title>
  <meta name="delta-invite-version" content="standalone-v2"/>
  <script>
  // Identifica convites ANTES de carregar o portal principal. Evita depender
  // do App.jsx / WebSocket / modulos privados quando a rota e publica.
  (() => {
  // Entrada pública isolada: remove app, MAC e token da barra antes dos imports.
    if (/^\/upload\/playlist\/?$/.test(location.pathname)) {
    const url = new URL(location.href);
    window.__PUBLIC_APP_QR__ = {
      app: url.searchParams.get('app') || '',
      mac: url.searchParams.get('mac') || '',
      token: url.searchParams.get('t') || '',
    };
    history.replaceState(history.state, '', '/upload/playlist');
    document.title = 'Cadastro de lista';
    return;
    }
    const url = new URL(window.location.href);
    const pathMatch = url.pathname.match(/^\/convite\/([^/]+)\/?$/);
    const commercialMatch = url.pathname.match(/^\/convite-comercial\/([^/]+)\/?$/);
    const networkMatch = url.pathname.match(/^\/convite-rede\/([^/]+)\/?$/);
    const isNetworkRoute = !!networkMatch || url.pathname === '/convite-rede' || url.pathname === '/convite-rede/';
    const isCommercialRoute = !!commercialMatch || url.pathname === "/convite-comercial" || url.pathname === "/convite-comercial/";
    const isInviteRoute = !!pathMatch || url.pathname === "/convite" || url.pathname === "/convite/";
    const hash = new URLSearchParams(url.hash.startsWith("#") ? url.hash.slice(1) : "");
    const isLegacy = url.searchParams.has("convite") || hash.has("convite");
    if (!isInviteRoute && !isLegacy && !isCommercialRoute && !isNetworkRoute) return;
    const storageKey = isNetworkRoute ? 'delta-partner-pending-network-invite' : isCommercialRoute ? "delta-partner-pending-commercial-invite" : "delta-partner-pending-invite";
    let token = networkMatch?.[1] || commercialMatch?.[1] || (isCommercialRoute ? hash.get("token") : null) || pathMatch?.[1] || url.searchParams.get("convite") || hash.get("convite") || "";
    try { token = decodeURIComponent(token); } catch { token = ""; }
    // Somente recarregamentos de /convite leem o token da aba atual.
    if (!token && (isInviteRoute || isCommercialRoute || isNetworkRoute)) {
      try { token = sessionStorage.getItem(storageKey) || ""; } catch {}
    }
    if (token) {
      try { sessionStorage.setItem(storageKey, token); } catch {}
    }
    window.__DELTA_PARTNER_INVITE_REQUEST__ = { token, type: isNetworkRoute ? 'network' : isCommercialRoute ? "commercial" : "legacy" };
    // Nao deixar o token na URL, mas MANTER a rota publica visivel.
    url.pathname = isNetworkRoute ? '/convite-rede' : isCommercialRoute ? "/convite-comercial" : "/convite";
    url.searchParams.delete("convite");
    if (hash.has("convite") || isCommercialRoute || isNetworkRoute) url.hash = "";
    window.history.replaceState(window.history.state, "", url.pathname + url.search + url.hash);
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script src="/pwa-register.js" defer></script>
  <script type="module">
    const isPublicQr = !!window.__PUBLIC_APP_QR__;
    const isReset = !isPublicQr && /^\/redefinir-senha\/?$/.test(window.location.pathname);
    if (isReset) {
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      window.__DELTA_PASSWORD_RESET_TOKEN__ = hash.get("token") || "";
      window.history.replaceState(window.history.state, "", "/redefinir-senha");
    }
    const isInvite = !isPublicQr && !isReset && !!window.__DELTA_PARTNER_INVITE_REQUEST__;
    if (isInvite) {
      document.getElementById("root").innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;background:#090d17;color:#fff;font:16px system-ui,sans-serif;padding:24px"><p>Carregando página de convite...</p></main>';
    }
    // Imports independentes: uma falha em um modulo do painel privado nao
    // bloqueia a pagina publica de cadastro.
    // Sem top-level await: compativel com o target padrao do Vite (ES2020).
    const entry = isPublicQr ? import("./src/public-upload-entry.jsx") : isReset
      ? import("./src/reset-entry.jsx")
      : isInvite ? import("./src/invite-entry.jsx") : import("./src/main.jsx");
    entry.catch((error) => {
      console.error("[delta-partner] Falha ao carregar o frontend", error);
      const root = document.getElementById("root");
      root.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;background:#090d17;color:#fff;font:16px system-ui,sans-serif;padding:24px;text-align:center"><div><h1>Não foi possível carregar o portal</h1><p>Atualize a página. Se continuar, avise a administração para verificar os arquivos publicados.</p></div></main>';
    });
  </script>
</body>
</html>
