<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#090d17"/>
  <meta name="referrer" content="no-referrer"/>
  <title>Delta TV | Painel do Parceiro</title>
  <script>
  // Captura o convite antes de carregar o React. Nenhum token fica no URL
  // depois desse ponto, nem deve ser enviado como parâmetro nas chamadas à API.
  (() => {
    const url = new URL(window.location.href);
    const viaPath = url.pathname === "/convite" || url.pathname.startsWith("/convite/");
    const routeToken = viaPath ? (url.pathname.match(/^\/convite\/([^/]+)\/?$/)?.[1] || "") : "";
    const hashParams = new URLSearchParams(url.hash.startsWith("#") ? url.hash.slice(1) : "");
    const viaQuery = url.searchParams.has("convite");
    const viaHash = hashParams.has("convite");
    if (!viaPath && !viaQuery && !viaHash) return;
    const token = routeToken || url.searchParams.get("convite") || hashParams.get("convite") || "";
    Object.defineProperty(window, "__DELTA_PARTNER_INVITE_REQUEST__", {
      value: { token }, configurable: true
    });
    if (viaPath) url.pathname = "/";
    url.searchParams.delete("convite");
    if (viaHash) url.hash = "";
    window.history.replaceState(window.history.state, "", url.pathname + url.search + url.hash);
  })();
  </script>
</head>
<body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
